// Streams test events to the stride Run tool window as one line per event.
// Values follow the TeamCity service-message escaping rules; see TestEventParser.kt.
// The task is forced to rerun so a repeated run still reports events.

import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.TestOutputEvent
import org.gradle.api.tasks.testing.TestResult

def escape = { String value ->
    if (value == null) return ""
    value
        .replace("|", "||")
        .replace("'", "|'")
        .replace("\n", "|n")
        .replace("\r", "|r")
        .replace("[", "|[")
        .replace("]", "|]")
}

def stackOf = { Throwable throwable ->
    if (throwable == null) return ""
    def writer = new java.io.StringWriter()
    throwable.printStackTrace(new java.io.PrintWriter(writer))
    def lines = writer.toString().readLines()
    if (lines.size() > 20) lines = lines.subList(0, 20)
    lines.join("\n")
}

allprojects { project ->
    // Runs one main from the runtime classpath of the chosen source set. Registered lazily for
    // every project so a project without the java plugin reports why it cannot run instead of
    // "task not found"; an ordinary build never configures or executes it.
    project.tasks.register('strideRunMain', JavaExec) { task ->
        def mainProperty = project.providers.gradleProperty('stride.mainClass')
        def sourceSetName = project.providers.gradleProperty('stride.sourceSet').getOrElse('main')
        mainClass.set(mainProperty.orElse(''))
        project.pluginManager.withPlugin('java') {
            task.classpath = project.sourceSets.getByName(sourceSetName).runtimeClasspath
        }
        standardInput = System.in
        workingDir = project.projectDir
        doFirst {
            if (!project.pluginManager.hasPlugin('java')) {
                throw new GradleException(
                    "stride: project ${project.path} does not apply the java plugin; cannot run " +
                        "${mainProperty.getOrElse('')}"
                )
            }
        }
    }

    tasks.withType(Test).configureEach { testTask ->
        testTask.outputs.upToDateWhen { false }
        testTask.outputs.cacheIf { false }

        testTask.beforeTest { descriptor ->
            if (descriptor.className == null || descriptor.composite) return
            println "##stride[test start class='${escape(descriptor.className)}' name='${escape(descriptor.name)}']"
        }

        testTask.afterTest { descriptor, result ->
            if (descriptor.className == null || descriptor.composite) return
            def kind = descriptor.className
            def name = descriptor.name
            def duration = Math.max(0L, result.endTime - result.startTime)
            switch (result.resultType) {
                case TestResult.ResultType.SUCCESS:
                    println "##stride[test pass class='${escape(kind)}' name='${escape(name)}' duration='${duration}']"
                    break
                case TestResult.ResultType.FAILURE:
                    def message = result.exception?.message ?: ""
                    def stack = stackOf(result.exception)
                    println "##stride[test fail class='${escape(kind)}' name='${escape(name)}' duration='${duration}' message='${escape(message)}' stack='${escape(stack)}']"
                    break
                case TestResult.ResultType.SKIPPED:
                    println "##stride[test skip class='${escape(kind)}' name='${escape(name)}']"
                    break
            }
        }

        testTask.onOutput { descriptor, event ->
            if (descriptor.className == null || descriptor.composite) return
            def stream = event.destination == TestOutputEvent.Destination.StdErr ? "stderr" : "stdout"
            println "##stride[test out class='${escape(descriptor.className)}' name='${escape(descriptor.name)}' stream='${stream}' text='${escape(event.message)}']"
        }
    }
}
